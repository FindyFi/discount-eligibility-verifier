<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Alennusoikeuden tarkastus</title>
  <meta name="description" content="Näytä eläkeläis- tai opiskelijaoikeutesi lompakostasi.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Discount eligibility verifier">
  <meta property="og:title" content="Alennusoikeuden tarkastus">
  <meta property="og:description" content="Näytä eläkeläis- tai opiskelijaoikeutesi lompakostasi.">
  <meta property="og:url" content="%PUBLIC_URL%/kiosk.html">
  <meta property="og:image" content="%PUBLIC_URL%/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Discount eligibility verifier: pensioner and student credentials from EUDI wallets.">
  <meta property="og:locale" content="fi_FI">
  <meta property="og:locale:alternate" content="sv_FI">
  <meta property="og:locale:alternate" content="en_GB">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Colours, fonts and the component theme come from the site stylesheet; the layout stays full screen. -->
  <link rel="stylesheet" href="site.css">
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
    header {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px;
      padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line);
    }
    h1 { font-size: clamp(1rem, 3.5vw, 1.3rem); min-width: 0; overflow-wrap: anywhere; }
    .segmented button { min-width: 48px; min-height: 40px; }
    credential-verifier { min-height: 0; }
  </style>
  <script type="module" src="verifier.js"></script>
</head>
<body>
  <header>
    <h1 data-i18n="title">Alennusoikeuden tarkastus</h1>
    <nav class="segmented" aria-label="Kieli / Språk / Language">
      <button type="button" data-lang="fi" aria-pressed="true">FI</button>
      <button type="button" data-lang="sv" aria-pressed="false">SV</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </nav>
  </header>
  <credential-verifier mode="kiosk"></credential-verifier>
  <script>
    // Language from ?lang=fi|sv|en, switchable from the header.
    const titles = { fi: 'Alennusoikeuden tarkastus', sv: 'Kontroll av rabattberättigande', en: 'Discount eligibility check' };
    const el = document.querySelector('credential-verifier');
    function setLang(lang) {
      if (!titles[lang]) return;
      document.documentElement.lang = lang;
      document.title = titles[lang];
      document.querySelector('[data-i18n="title"]').textContent = titles[lang];
      el.setAttribute('lang', lang);
      for (const b of document.querySelectorAll('nav button')) b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
    }
    const params = new URLSearchParams(location.search);
    // ?sound=off for quiet locations (skips the "tap to start" step that unlocks audio)
    if (params.get('sound') === 'off') el.setAttribute('sound', 'off');
    setLang(params.get('lang') || 'fi');
    document.querySelector('nav').addEventListener('click', (e) => setLang(e.target.closest('button')?.dataset.lang));
  </script>
</body>
</html>
